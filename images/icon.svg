<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Document with a folded corner -->
  <path d="M56 40 H142 L184 82 V208 a12 12 0 0 1 -12 12 H56 a12 12 0 0 1 -12 -12 V52 a12 12 0 0 1 12 -12 z" fill="url(#paper)"/>
  <path d="M142 40 V70 a12 12 0 0 0 12 12 H184 z" fill="#93c5fd"/>

  <!-- Code lines -->
  <g stroke-width="10" stroke-linecap="round">
    <path d="M70 102 H118" stroke="#1e3a8a"/>
    <path d="M86 128 H150" stroke="#60a5fa"/>
    <path d="M86 154 H130" stroke="#60a5fa"/>
    <path d="M70 180 H104" stroke="#1e3a8a"/>
  </g>

  <!-- Pencil writing on the document -->
  <g transform="rotate(-45 150 186)">
    <rect x="150" y="174" width="84" height="24" rx="5" fill="url(#accent)"/>
    <rect x="218" y="174" width="16" height="24" rx="4" fill="#fdba74"/>
    <path d="M150 174 L126 186 L150 198 Z" fill="#fde7d4"/>
    <path d="M134 182 L126 186 L134 190 Z" fill="#0f172a"/>
  </g>

  <!-- Server badge -->
  <circle cx="198" cy="58" r="40" fill="#0f172a"/>
  <circle cx="198" cy="58" r="34" fill="#60a5fa"/>
  <rect x="176" y="40" width="44" height="15" rx="4" fill="#0f172a"/>
  <rect x="176" y="61" width="44" height="15" rx="4" fill="#0f172a"/>
  <circle cx="210" cy="47.5" r="3.5" fill="#fb923c"/>
  <circle cx="210" cy="68.5" r="3.5" fill="#fb923c"/>
</svg>
